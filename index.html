<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bam Bam</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c1620">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1b1d1f;
    --panel: #24272a;
    --panel-2: #2c3033;
    --steel: #4a5056;
    --steel-light: #6b7278;
    --text: #eae7e1;
    --text-dim: #9a9d9f;
    --yellow: #f4b942;
    --rust: #c1502e;
    --green: #82a878;
    --radius: 3px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 8px),
      var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    padding:0 0 3rem 0;
    min-height:100vh;
  }
  .wrap{max-width:640px; margin:0 auto; padding:0 1rem;}

  header{
    padding:1.8rem 1rem 1.4rem 1rem;
    border-bottom:3px solid var(--yellow);
    background:var(--panel);
    margin-bottom:1.5rem;
  }
  header .inner{max-width:640px; margin:0 auto; display:flex; align-items:center; gap:0.9rem;}
  header svg{flex-shrink:0;}
  h1{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size:1.5rem;
    letter-spacing:0.02em;
    margin:0;
    line-height:1.1;
  }
  header p{
    margin:0.2rem 0 0 0;
    color:var(--text-dim);
    font-size:0.85rem;
  }

  section{
    background:var(--panel);
    border:1px solid var(--steel);
    border-radius:var(--radius);
    padding:1.1rem 1rem;
    margin-bottom:1rem;
  }
  h2{
    font-family:'Oswald', sans-serif;
    font-weight:500;
    font-size:1rem;
    margin:0 0 0.9rem 0;
    color:var(--yellow);
    display:flex;
    align-items:baseline;
    gap:0.5rem;
  }
  h2 .num{color:var(--steel-light); font-size:0.85rem;}
  h3{
    font-family:'Oswald', sans-serif;
    font-weight:500;
    font-size:0.9rem;
    margin:1.2rem 0 0.6rem 0;
    color:var(--text);
  }

  .row{display:flex; gap:0.6rem; margin-bottom:0.6rem; flex-wrap:wrap;}
  .field{flex:1; min-width:90px;}
  .field label{
    display:block;
    font-size:0.72rem;
    color:var(--text-dim);
    margin-bottom:0.25rem;
  }
  input[type=number], input[type=text], select{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--steel);
    color:var(--text);
    padding:0.55rem 0.6rem;
    border-radius:var(--radius);
    font-family:'Inter', sans-serif;
    font-size:0.95rem;
  }
  select{ appearance:none; -webkit-appearance:none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%239a9d9f'/></svg>");
    background-repeat:no-repeat; background-position:right 0.6rem center;
    padding-right:1.6rem;
  }
  input:focus, select:focus{outline:2px solid var(--yellow); outline-offset:1px;}

  .quickbtns{display:flex; gap:0.4rem; margin-top:0.3rem;}
  .quickbtn{
    background:var(--panel-2);
    border:1px solid var(--steel);
    color:var(--text-dim);
    padding:0.3rem 0.6rem;
    border-radius:var(--radius);
    font-size:0.78rem;
    cursor:pointer;
  }
  .quickbtn:hover{border-color:var(--yellow); color:var(--yellow);}

  button.primary{
    background:var(--yellow);
    color:#1b1d1f;
    border:none;
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size:0.95rem;
    letter-spacing:0.02em;
    padding:0.75rem 1rem;
    border-radius:var(--radius);
    width:100%;
    cursor:pointer;
    margin-top:0.4rem;
  }
  button.primary:hover{background:#ffc860;}
  button.primary:disabled{background:var(--steel); color:var(--text-dim); cursor:not-allowed;}

  button.ghost{
    background:transparent;
    border:1px dashed var(--steel-light);
    color:var(--text-dim);
    padding:0.55rem;
    border-radius:var(--radius);
    width:100%;
    cursor:pointer;
    font-size:0.85rem;
  }
  button.ghost:hover{border-color:var(--yellow); color:var(--yellow);}
  button.ghost.editing{border-style:solid; border-color:var(--yellow); color:var(--yellow);}

  .piece-list{margin-top:0.7rem;}
  .piece{
    display:flex;
    align-items:center;
    gap:0.4rem;
    background:var(--panel-2);
    border-left:4px solid var(--pc, var(--steel-light));
    border-radius:var(--radius);
    padding:0.5rem 0.6rem;
    margin-bottom:0.4rem;
    font-size:0.88rem;
  }
  .piece .desc{flex:1;}
  .piece .desc b{color:var(--text);}
  .piece .desc .mat{color:var(--text-dim); font-size:0.76rem;}
  .piece .qty{color:var(--text-dim);}
  .piece .iconbtn{
    background:none; border:none; color:var(--text-dim); cursor:pointer;
    font-size:1rem; line-height:1; padding:0.25rem 0.35rem;
  }
  .piece .iconbtn.del:hover{color:var(--rust);}
  .piece .iconbtn.edit:hover{color:var(--yellow);}

  .mat-row{
    display:flex; gap:0.5rem; align-items:center; margin-bottom:0.5rem;
  }
  .mat-row input[type=text]{flex:1.3;}
  .mat-row input[type=number]{flex:1;}
  .mat-row .iconbtn{flex:0 0 auto;}

  .empty-hint{color:var(--text-dim); font-size:0.85rem; padding:0.4rem 0;}

  /* results */
  .summary{
    display:flex; gap:0.8rem; margin-bottom:1.1rem;
  }
  .stat{
    flex:1;
    background:var(--panel-2);
    border-radius:var(--radius);
    padding:0.7rem 0.6rem;
    text-align:center;
  }
  .stat .val{font-family:'Oswald', sans-serif; font-size:1.6rem; font-weight:600; color:var(--yellow);}
  .stat .lbl{font-size:0.72rem; color:var(--text-dim); margin-top:0.1rem;}

  .material-group{margin-bottom:1.6rem; padding-bottom:0.2rem; border-bottom:1px solid var(--steel);}
  .material-group:last-child{border-bottom:none;}
  .material-title{
    font-family:'Oswald', sans-serif;
    font-size:1rem;
    color:var(--text);
    margin-bottom:0.7rem;
    display:flex; justify-content:space-between; align-items:baseline;
  }
  .material-title .mcost{color:var(--yellow); font-size:0.85rem;}

  .bar-block{margin-bottom:1rem;}
  .bar-title{font-size:0.8rem; color:var(--text-dim); margin-bottom:0.35rem; display:flex; justify-content:space-between;}
  .bar-title .waste{color:var(--rust);}
  .bar-strip{
    display:flex;
    height:2.6rem;
    border-radius:var(--radius);
    overflow:hidden;
    border:1px solid var(--steel);
  }
  .seg{
    display:flex; align-items:center; justify-content:center;
    font-size:0.72rem;
    color:#1b1d1f;
    font-weight:600;
    border-right:2px solid rgba(0,0,0,0.35);
    overflow:hidden;
    white-space:nowrap;
    padding:0 2px;
  }
  .seg.waste{
    background:repeating-linear-gradient(45deg, #33383c, #33383c 5px, #2c3033 5px, #2c3033 10px);
    color:var(--text-dim);
    border-right:none;
  }
  .seg.kerf{
    background:#111214;
    flex-grow:0;
    border-right:none;
  }

  footer{
    text-align:center;
    color:var(--text-dim);
    font-size:0.75rem;
    padding:1rem 1rem 0 1rem;
  }
</style>
</head>

<div class="wrap">

  <section>
    <h2>Proyectos</h2>
    <div class="row">
      <div class="field">
        <label for="projectName">Nombre del proyecto</label>
        <input type="text" id="projectName" placeholder="ej: Estante cliente Pérez">
      </div>
    </div>
    <div class="row">
      <div class="field"><button class="ghost" id="saveProjectBtn">Guardar proyecto</button></div>
      <div class="field"><button class="ghost" id="newProjectBtn">Nuevo proyecto</button></div>
    </div>
    <div id="savedProjectsBlock" style="display:none;">
      <div class="row">
        <div class="field" style="flex:2;">
          <label for="projectSelect">Proyectos guardados</label>
          <select id="projectSelect"></select>
        </div>
      </div>
      <div class="row">
        <div class="field"><button class="ghost" id="loadProjectBtn">Abrir proyecto</button></div>
        <div class="field"><button class="ghost" id="deleteProjectBtn" style="border-color:var(--rust); color:var(--rust);">Eliminar</button></div>
      </div>
    </div>
    <div class="empty-hint" id="currentProjectHint">Trabajo sin guardar.</div>
  </section>

  <section>
    <h2><span class="num">1</span> Barra</h2>
    <div class="row">
      <div class="field">
        <label for="barLength">Largo de barra (cm)</label>
        <input type="number" id="barLength" value="600" min="1" step="0.1">
        <div class="quickbtns">
          <button class="quickbtn" data-len="600">600</button>
          <button class="quickbtn" data-len="603">603</button>
        </div>
      </div>
      <div class="field">
        <label for="kerf">Pérdida por corte (mm)</label>
        <input type="number" id="kerf" value="1.2" min="0" step="0.1">
      </div>
    </div>

    <h3>Materiales / perfiles</h3>
    <div id="materialRows"></div>
    <button class="ghost" id="addMaterial">+ Agregar material</button>
  </section>

  <section>
    <h2><span class="num">2</span> Piezas necesarias</h2>
    <div class="row">
      <div class="field" style="flex:1.4;">
        <label for="pLabel">Nombre (opcional)</label>
        <input type="text" id="pLabel" placeholder="ej: pata">
      </div>
      <div class="field">
        <label for="pLength">Largo (cm)</label>
        <input type="number" id="pLength" min="0.1" step="0.1" placeholder="35">
      </div>
      <div class="field">
        <label for="pQty">Cantidad</label>
        <input type="number" id="pQty" min="1" step="1" value="1">
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label for="pMaterial">Material</label>
        <select id="pMaterial"></select>
      </div>
    </div>
    <button class="ghost" id="addPiece">+ Agregar pieza</button>

    <div class="piece-list" id="pieceList">
      <div class="empty-hint" id="emptyHint">Todavía no agregaste ninguna pieza.</div>
    </div>
  </section>

  <section>
    <h2><span class="num">3</span> Insumos extra <span style="color:var(--text-dim); font-weight:400; font-size:0.75rem;">(opcional)</span></h2>
    <div class="row">
      <div class="field" style="flex:1.6;">
        <label for="iName">Insumo</label>
        <input type="text" id="iName" placeholder="ej: discos de corte">
      </div>
      <div class="field">
        <label for="iPrice">Precio ($)</label>
        <input type="number" id="iPrice" min="0" step="1" placeholder="1000">
      </div>
    </div>
    <button class="ghost" id="addInsumo">+ Agregar insumo</button>

    <div class="piece-list" id="insumoList">
      <div class="empty-hint" id="emptyInsumoHint">Sin insumos extra cargados.</div>
    </div>
  </section>

  <button class="primary" id="calcBtn" disabled>Calcular optimización</button>

  <section id="results" style="display:none;"></section>

  <footer>Los cálculos son una guía. Medí siempre antes de cortar.</footer>
</div>

<script>
const COLORS = ['#f4b942','#82a878','#c1502e','#5b8fa8','#a877a8','#c99a4e','#6b9e78','#b25a5a'];

let materials = [{id:1, name:'', price:''}];
let matSeq = 2;
let pieces = []; // {id, label, length, qty, color, materialId}
let insumos = []; // {id, name, price}
let idSeq = 1;
let insumoSeq = 1;
let editingPieceId = null;
let editingInsumoId = null;
let savedProjects = [];
let currentProjectId = null;

const barLengthEl = document.getElementById('barLength');
const kerfEl = document.getElementById('kerf');
const materialRowsEl = document.getElementById('materialRows');
const pMaterialEl = document.getElementById('pMaterial');
const pieceListEl = document.getElementById('pieceList');
const emptyHint = document.getElementById('emptyHint');
const insumoListEl = document.getElementById('insumoList');
const emptyInsumoHint = document.getElementById('emptyInsumoHint');
const calcBtn = document.getElementById('calcBtn');
const resultsEl = document.getElementById('results');
const addPieceBtn = document.getElementById('addPiece');
const addInsumoBtn = document.getElementById('addInsumo');
const projectNameEl = document.getElementById('projectName');
const saveProjectBtn = document.getElementById('saveProjectBtn');
const newProjectBtn = document.getElementById('newProjectBtn');
const savedProjectsBlock = document.getElementById('savedProjectsBlock');
const projectSelectEl = document.getElementById('projectSelect');
const loadProjectBtn = document.getElementById('loadProjectBtn');
const deleteProjectBtn = document.getElementById('deleteProjectBtn');
const currentProjectHint = document.getElementById('currentProjectHint');

document.querySelectorAll('.quickbtn').forEach(b=>{
  b.addEventListener('click', ()=>{ barLengthEl.value = b.dataset.len; save(); });
});

// --- materiales ---
document.getElementById('addMaterial').addEventListener('click', ()=>{
  materials.push({id: matSeq++, name:'', price:''});
  renderMaterials();
  save();
});

function renderMaterials(){
  materialRowsEl.innerHTML = '';
  materials.forEach(m=>{
    const row = document.createElement('div');
    row.className = 'mat-row';
    row.innerHTML = `
      <input type="text" placeholder="ej: Caño 30x30" value="${m.name.replace(/"/g,'&quot;')}" data-id="${m.id}" data-field="name">
      <input type="number" min="0" step="1" placeholder="precio x barra" value="${m.price}" data-id="${m.id}" data-field="price">
      <button class="iconbtn del" data-id="${m.id}" title="Quitar material" ${materials.length<=1?'disabled style="opacity:0.3;"':''}>✕</button>
    `;
    materialRowsEl.appendChild(row);
  });
  materialRowsEl.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const m = materials.find(x=>x.id == inp.dataset.id);
      if(!m) return;
      if(inp.dataset.field === 'name') m.name = inp.value.trim();
      else m.price = inp.value;
      renderMaterialOptions();
      save();
    });
  });
  materialRowsEl.querySelectorAll('.del').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(materials.length <= 1) return;
      materials = materials.filter(m => m.id != btn.dataset.id);
      renderMaterials();
      renderMaterialOptions();
      renderPieces();
      save();
    });
  });
  renderMaterialOptions();
}

function materialLabel(m){
  return m.name && m.name.trim() ? m.name.trim() : 'General';
}

function renderMaterialOptions(){
  const prevSelected = pMaterialEl.value;
  pMaterialEl.innerHTML = materials.map(m=>`<option value="${m.id}">${materialLabel(m)}</option>`).join('');
  if(materials.some(m=>String(m.id)===prevSelected)) pMaterialEl.value = prevSelected;
}

// --- piezas ---
function resetPieceForm(){
  document.getElementById('pLabel').value = '';
  document.getElementById('pLength').value = '';
  document.getElementById('pQty').value = '1';
  editingPieceId = null;
  addPieceBtn.textContent = '+ Agregar pieza';
  addPieceBtn.classList.remove('editing');
}

addPieceBtn.addEventListener('click', ()=>{
  const label = document.getElementById('pLabel').value.trim();
  const length = parseFloat(document.getElementById('pLength').value);
  const qty = parseInt(document.getElementById('pQty').value) || 1;
  const materialId = parseInt(pMaterialEl.value);
  if(!length || length <= 0){ document.getElementById('pLength').focus(); return; }

  if(editingPieceId){
    const p = pieces.find(x=>x.id === editingPieceId);
    if(p){ p.label = label || null; p.length = length; p.qty = qty; p.materialId = materialId; }
  } else {
    pieces.push({
      id: idSeq++,
      label: label || null,
      length, qty, materialId,
      color: COLORS[(pieces.length) % COLORS.length]
    });
  }
  resetPieceForm();
  renderPieces();
  save();
});

function renderPieces(){
  pieceListEl.innerHTML = '';
  if(pieces.length === 0){
    pieceListEl.appendChild(emptyHint);
    calcBtn.disabled = true;
    return;
  }
  calcBtn.disabled = false;
  pieces.forEach(p=>{
    const mat = materials.find(m=>m.id === p.materialId);
    const div = document.createElement('div');
    div.className = 'piece';
    div.style.setProperty('--pc', p.color);
    div.innerHTML = `
      <div class="desc"><b>${p.label ? p.label + ' — ' : ''}${p.length} cm</b> <span class="qty">x${p.qty}</span><br>
      <span class="mat">${mat ? materialLabel(mat) : 'General'}</span></div>
      <button class="iconbtn edit" data-id="${p.id}" title="Modificar">✎</button>
      <button class="iconbtn del" data-id="${p.id}" title="Quitar">✕</button>
    `;
    pieceListEl.appendChild(div);
  });
  pieceListEl.querySelectorAll('.del').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      pieces = pieces.filter(p => p.id != btn.dataset.id);
      if(editingPieceId == btn.dataset.id) resetPieceForm();
      renderPieces();
      save();
    });
  });
  pieceListEl.querySelectorAll('.edit').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const p = pieces.find(x=>x.id == btn.dataset.id);
      if(!p) return;
      document.getElementById('pLabel').value = p.label || '';
      document.getElementById('pLength').value = p.length;
      document.getElementById('pQty').value = p.qty;
      pMaterialEl.value = p.materialId;
      editingPieceId = p.id;
      addPieceBtn.textContent = '✓ Guardar cambios';
      addPieceBtn.classList.add('editing');
      document.getElementById('pLabel').scrollIntoView({behavior:'smooth', block:'center'});
    });
  });
}

// --- insumos ---
function resetInsumoForm(){
  document.getElementById('iName').value = '';
  document.getElementById('iPrice').value = '';
  editingInsumoId = null;
  addInsumoBtn.textContent = '+ Agregar insumo';
  addInsumoBtn.classList.remove('editing');
}

addInsumoBtn.addEventListener('click', ()=>{
  const name = document.getElementById('iName').value.trim();
  const price = parseFloat(document.getElementById('iPrice').value);
  if(!name || isNaN(price) || price < 0){ document.getElementById('iName').focus(); return; }

  if(editingInsumoId){
    const ins = insumos.find(x=>x.id === editingInsumoId);
    if(ins){ ins.name = name; ins.price = price; }
  } else {
    insumos.push({ id: insumoSeq++, name, price });
  }
  resetInsumoForm();
  renderInsumos();
  save();
});

function renderInsumos(){
  insumoListEl.innerHTML = '';
  if(insumos.length === 0){
    insumoListEl.appendChild(emptyInsumoHint);
    return;
  }
  insumos.forEach(ins=>{
    const div = document.createElement('div');
    div.className = 'piece';
    div.style.setProperty('--pc', 'var(--yellow)');
    div.innerHTML = `
      <div class="desc"><b>${ins.name}</b> <span class="qty">$${ins.price.toLocaleString('es-AR')}</span></div>
      <button class="iconbtn edit" data-id="${ins.id}" title="Modificar">✎</button>
      <button class="iconbtn del" data-id="${ins.id}" title="Quitar">✕</button>
    `;
    insumoListEl.appendChild(div);
  });
  insumoListEl.querySelectorAll('.del').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      insumos = insumos.filter(i => i.id != btn.dataset.id);
      if(editingInsumoId == btn.dataset.id) resetInsumoForm();
      renderInsumos();
      save();
    });
  });
  insumoListEl.querySelectorAll('.edit').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const ins = insumos.find(x=>x.id == btn.dataset.id);
      if(!ins) return;
      document.getElementById('iName').value = ins.name;
      document.getElementById('iPrice').value = ins.price;
      editingInsumoId = ins.id;
      addInsumoBtn.textContent = '✓ Guardar cambios';
      addInsumoBtn.classList.add('editing');
      document.getElementById('iName').scrollIntoView({behavior:'smooth', block:'center'});
    });
  });
}

// --- proyectos ---
function currentState(){
  return {
    barLength: barLengthEl.value,
    kerf: kerfEl.value,
    materials: JSON.parse(JSON.stringify(materials)),
    pieces: JSON.parse(JSON.stringify(pieces)),
    insumos: JSON.parse(JSON.stringify(insumos))
  };
}

function applyState(state){
  barLengthEl.value = state.barLength || 600;
  kerfEl.value = state.kerf || 1.2;
  materials = (state.materials && state.materials.length) ? state.materials : [{id:1, name:'', price:''}];
  matSeq = materials.reduce((m,x)=> Math.max(m, x.id||0), 0) + 1;
  pieces = state.pieces || [];
  insumos = state.insumos || [];
  idSeq = pieces.reduce((m,p)=> Math.max(m, p.id||0), 0) + 1;
  insumoSeq = insumos.reduce((m,i)=> Math.max(m, i.id||0), 0) + 1;
  resetPieceForm();
  resetInsumoForm();
  renderMaterials();
  renderPieces();
  renderInsumos();
  resultsEl.style.display = 'none';
}

function renderProjectSelect(){
  projectSelectEl.innerHTML = savedProjects.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
  savedProjectsBlock.style.display = savedProjects.length ? 'block' : 'none';
  if(currentProjectId && savedProjects.some(p=>p.id===currentProjectId)){
    projectSelectEl.value = currentProjectId;
  }
}

function updateCurrentProjectHint(){
  if(currentProjectId){
    const p = savedProjects.find(x=>x.id===currentProjectId);
    currentProjectHint.textContent = p ? `Editando: ${p.name}` : 'Trabajo sin guardar.';
  } else {
    currentProjectHint.textContent = 'Trabajo sin guardar.';
  }
}

saveProjectBtn.addEventListener('click', ()=>{
  const name = projectNameEl.value.trim();
  if(!name){ projectNameEl.focus(); return; }
  let existing = currentProjectId ? savedProjects.find(p=>p.id===currentProjectId) : savedProjects.find(p=>p.name === name);
  if(existing){
    existing.name = name;
    existing.state = currentState();
    currentProjectId = existing.id;
  } else {
    const proj = { id: Date.now(), name, state: currentState() };
    savedProjects.push(proj);
    currentProjectId = proj.id;
  }
  renderProjectSelect();
  updateCurrentProjectHint();
  save();
});

newProjectBtn.addEventListener('click', ()=>{
  currentProjectId = null;
  projectNameEl.value = '';
  applyState({ barLength: barLengthEl.value, kerf: kerfEl.value, materials:[{id:1,name:'',price:''}], pieces:[], insumos:[] });
  updateCurrentProjectHint();
  save();
});

loadProjectBtn.addEventListener('click', ()=>{
  const id = parseInt(projectSelectEl.value);
  const p = savedProjects.find(x=>x.id === id);
  if(!p) return;
  currentProjectId = p.id;
  projectNameEl.value = p.name;
  applyState(p.state);
  updateCurrentProjectHint();
  save();
});

deleteProjectBtn.addEventListener('click', ()=>{
  const id = parseInt(projectSelectEl.value);
  savedProjects = savedProjects.filter(p=>p.id !== id);
  if(currentProjectId === id) currentProjectId = null;
  renderProjectSelect();
  updateCurrentProjectHint();
  save();
});

// --- optimization ---
function optimize(barLengthCm, kerfMm, pieceDefs){
  const kerf = kerfMm / 10; // to cm
  let items = [];
  pieceDefs.forEach(p=>{
    for(let i=0;i<p.qty;i++) items.push({length:p.length, label:p.label, color:p.color});
  });

  function pack(order){
    let bars = [];
    order.forEach(item=>{
      let bestBar = null, bestRemainder = Infinity;
      for(const bar of bars){
        const need = item.length + (bar.items.length > 0 ? kerf : 0);
        if(bar.remaining >= need - 1e-9){
          const rem = bar.remaining - need;
          if(rem < bestRemainder){ bestRemainder = rem; bestBar = bar; }
        }
      }
      if(bestBar){
        const need = item.length + (bestBar.items.length > 0 ? kerf : 0);
        bestBar.remaining -= need;
        bestBar.items.push(item);
      } else {
        bars.push({remaining: barLengthCm - item.length, items:[item]});
      }
    });
    return bars;
  }

  function totalWaste(bars){
    return bars.reduce((s,b)=> s + Math.max(0,b.remaining), 0);
  }

  if(items.length === 0) return [];

  let best = null;
  const desc = [...items].sort((a,b)=> b.length - a.length);
  best = pack(desc);

  for(let i=0;i<25;i++){
    const shuffled = [...items].sort(()=> Math.random() - 0.5);
    const candidate = pack(shuffled);
    if(candidate.length < best.length ||
      (candidate.length === best.length && totalWaste(candidate) < totalWaste(best))){
      best = candidate;
    }
  }
  return best;
}

calcBtn.addEventListener('click', ()=>{
  const barLength = parseFloat(barLengthEl.value);
  const kerf = parseFloat(kerfEl.value) || 0;
  if(!barLength || barLength <= 0) return;

  const groups = materials.map(m=>{
    const matPieces = pieces.filter(p => p.materialId === m.id);
    return { material: m, bars: optimize(barLength, kerf, matPieces) };
  }).filter(g => g.bars.length > 0);

  renderResults(groups, barLength, kerf);
});

function renderResults(groups, barLength, kerfMm){
  const kerf = kerfMm / 10;
  const fmt = (n)=> '$' + n.toLocaleString('es-AR', {maximumFractionDigits:0});

  let totalBars = 0, totalWasteCm = 0, totalMaterial = 0, costoMateriales = 0;
  groups.forEach(g=>{
    totalBars += g.bars.length;
    totalMaterial += g.bars.length * barLength;
    totalWasteCm += g.bars.reduce((s,b)=> s + Math.max(0,b.remaining), 0);
    const price = parseFloat(g.material.price) || 0;
    costoMateriales += g.bars.length * price;
  });
  const eficiencia = totalMaterial > 0 ? ((totalMaterial - totalWasteCm) / totalMaterial * 100) : 0;
  const costoInsumos = insumos.reduce((s,i)=> s + i.price, 0);
  const costoTotal = costoMateriales + costoInsumos;

  let html = `
    <h2><span class="num">4</span> Resultado</h2>
    <div class="summary">
      <div class="stat"><div class="val">${totalBars}</div><div class="lbl">barras en total</div></div>
      <div class="stat"><div class="val">${eficiencia.toFixed(1)}%</div><div class="lbl">aprovechamiento</div></div>
      <div class="stat"><div class="val">${totalWasteCm.toFixed(1)}</div><div class="lbl">cm de sobrante</div></div>
    </div>
  `;

  if(costoMateriales > 0 || costoInsumos > 0){
    html += `<div class="summary" style="margin-bottom:1.3rem;">
      <div class="stat"><div class="val" style="color:var(--text); font-size:1.1rem;">${fmt(costoMateriales)}</div><div class="lbl">material</div></div>
      <div class="stat"><div class="val" style="color:var(--text); font-size:1.1rem;">${fmt(costoInsumos)}</div><div class="lbl">insumos extra</div></div>
      <div class="stat" style="border:1px solid var(--yellow);"><div class="val">${fmt(costoTotal)}</div><div class="lbl">total</div></div>
    </div>`;
  }

  groups.forEach(g=>{
    const price = parseFloat(g.material.price) || 0;
    const groupCost = g.bars.length * price;
    html += `<div class="material-group">
      <div class="material-title"><span>${materialLabel(g.material)} — ${g.bars.length} barra${g.bars.length===1?'':'s'}</span>${groupCost>0?`<span class="mcost">${fmt(groupCost)}</span>`:''}</div>`;

    g.bars.forEach((bar, idx)=>{
      const waste = Math.max(0, bar.remaining);
      html += `<div class="bar-block">
        <div class="bar-title"><span>Barra ${idx+1}</span><span class="waste">sobrante: ${waste.toFixed(1)} cm</span></div>
        <div class="bar-strip">`;
      bar.items.forEach((item, i)=>{
        if(i > 0 && kerf > 0){
          const kerfPct = (kerf / barLength) * 100;
          html += `<div class="seg kerf" style="width:${kerfPct}%"></div>`;
        }
        const pct = (item.length / barLength) * 100;
        const txt = `${item.label ? item.label + ' ' : ''}${item.length}cm`;
        html += `<div class="seg" style="width:${pct}%; background:${item.color};" title="${txt}">${txt}</div>`;
      });
      if(waste > 0.05){
        const wPct = (waste / barLength) * 100;
        html += `<div class="seg waste" style="width:${wPct}%">${waste.toFixed(0)}cm</div>`;
      }
      html += `</div></div>`;
    });
    html += `</div>`;
  });

  resultsEl.innerHTML = html;
  resultsEl.style.display = 'block';
  resultsEl.scrollIntoView({behavior:'smooth', block:'start'});
}

// --- persistence (personal, not shared) ---
function save(){
  try{
    localStorage.setItem('optimizador-cortes:state', JSON.stringify({
      barLength: barLengthEl.value,
      kerf: kerfEl.value,
      materials,
      pieces,
      insumos,
      savedProjects,
      currentProjectId
    }));
  }catch(e){ /* storage unavailable, ignore */ }
}

function load(){
  try{
    const raw = localStorage.getItem('optimizador-cortes:state');
    if(raw){
      const state = JSON.parse(raw);
      barLengthEl.value = state.barLength || 600;
      kerfEl.value = state.kerf || 1.2;
      materials = (state.materials && state.materials.length) ? state.materials : [{id:1, name:'', price:''}];
      matSeq = materials.reduce((m,x)=> Math.max(m, x.id||0), 0) + 1;
      pieces = state.pieces || [];
      insumos = state.insumos || [];
      idSeq = pieces.reduce((m,p)=> Math.max(m, p.id||0), 0) + 1;
      insumoSeq = insumos.reduce((m,i)=> Math.max(m, i.id||0), 0) + 1;
      savedProjects = state.savedProjects || [];
      currentProjectId = state.currentProjectId || null;
      if(currentProjectId){
        const cp = savedProjects.find(p=>p.id===currentProjectId);
        if(cp) projectNameEl.value = cp.name;
      }
    }
  }catch(e){ /* first run, no saved state */ }
  renderMaterials();
  renderPieces();
  renderInsumos();
  renderProjectSelect();
  updateCurrentProjectHint();
}

barLengthEl.addEventListener('change', save);
kerfEl.addEventListener('change', save);

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

load();
</script>
